    <rect x="290" y="180" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="290" y="196" width="100" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="290" y="212" width="60" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  </g>
  <g filter="url(#glow-sm)">
    <circle cx="350" cy="310" r="24" fill="none" stroke="url(#cyan)" stroke-width="2"/>
    <path d="M350 298v12l8 6" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)">
