    <path d="M100 0v440M200 0v440M300 0v440M400 0v440M500 0v440M600 0v440"/>
  </g>
  <circle cx="580" cy="80" r="120" fill="url(#gold)" opacity="0.08"/>
  <circle cx="120" cy="360" r="100" fill="url(#cyan)" opacity="0.06"/>
  <g filter="url(#glow)">
    <rect x="250" y="120" width="200" height="160" rx="16" fill="rgba(255,255,255,0.04)" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="270" y="140" width="160" height="120" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
  <g filter="url(#glow-sm)">
