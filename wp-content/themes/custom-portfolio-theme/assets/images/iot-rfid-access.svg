    <rect x="560" y="340" width="60" height="40" rx="8" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  </g>
  <g stroke="rgba(212,175,55,0.2)" stroke-width="1" stroke-dasharray="4 4">
