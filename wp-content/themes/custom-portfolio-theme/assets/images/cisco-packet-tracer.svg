    <rect x="440" y="200" width="20" height="50" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
  <g font-family="monospace" font-size="9" fill="rgba(255,255,255,0.25)">
