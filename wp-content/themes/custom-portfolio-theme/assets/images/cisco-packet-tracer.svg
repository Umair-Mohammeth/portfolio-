  </g>
  <circle cx="350" cy="220" r="160" fill="url(#orange)" opacity="0.06"/>
  <g filter="url(#glow)">
    <rect x="200" y="100" width="300" height="240" rx="20" fill="rgba(255,255,255,0.04)" stroke="url(#gold)" stroke-width="1.5"/>
  </g>
  <g filter="url(#glow-sm)">
    <rect x="220" y="120" width="260" height="200" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="240" y="140" width="100" height="10" rx="5" fill="url(#gold)" opacity="0.7"/>
    <rect x="240" y="160" width="220" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
    <rect x="240" y="176" width="180" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  </g>
  <g filter="url(#glow-sm)">
    <rect x="240" y="200" width="80" height="50" rx="8" fill="rgba(255,140,66,0.1)" stroke="rgba(255,140,66,0.3)" stroke-width="1"/>
